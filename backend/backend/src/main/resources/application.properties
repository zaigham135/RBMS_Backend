spring.application.name=backend

# ── Active Profile ────────────────────────────────────────────────────────────
# Use 'dev' for local development (Redis sessions)
# Use 'prod' for production deployment (JDBC sessions)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Session Management ────────────────────────────────────────────────────────
# Disable session management for initial deployment
# Sessions will be stateless (JWT-based authentication only)
spring.session.store-type=none

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/task_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── Liquibase ─────────────────────────────────────────────────────────────────
# Disabled in favor of Hibernate DDL for initial schema creation
spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1

# ── Web ───────────────────────────────────────────────────────────────────────
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ── Actuator ──────────────────────────────────────────────────────────────────
# Enable health endpoint for load balancer health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.example.backend=INFO
logging.level.com.example.backend.config.JwtFilter=WARN
logging.level.org.springframework.cache=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── Mail ──────────────────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Google OAuth2 ─────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ── ImageKit ──────────────────────────────────────────────────────────────────
imagekit.public-key=${IMAGEKIT_PUBLIC_KEY}
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY}
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT}

# ── Google Calendar / Meet ────────────────────────────────────────────────────
# Enable/disable Google Meet auto-generation (requires Google Workspace for personal accounts)
google.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:false}
# Path to Google service account credentials JSON file (use absolute path)
google.calendar.credentials.file=${GOOGLE_CALENDAR_CREDENTIALS_FILE:E:/role based task  management project/Backend_Java/backend/backend/config/google-credentials.json}

# ── AWS DynamoDB (Production Only) ────────────────────────────────────────────
# DynamoDB region for session storage (only used when spring.profiles.active=prod)
aws.dynamodb.region=${AWS_REGION:us-east-1}
# Session timeout in seconds (30 minutes default)
spring.session.timeout=${SESSION_TIMEOUT:1800}
